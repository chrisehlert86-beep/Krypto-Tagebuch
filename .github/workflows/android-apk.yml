name: Android APK

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Krypto-Charts-Android
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Krypto-Charts-Android
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-debug.apk Krypto-Charts.apk
          gh release create "$GITHUB_REF_NAME" Krypto-Charts.apk --title "Krypto Charts $GITHUB_REF_NAME" --generate-notes
