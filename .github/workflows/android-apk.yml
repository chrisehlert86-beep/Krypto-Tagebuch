name: Android APK

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Krypto-Charts-Android
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build-apk, device-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Krypto-Charts-Android
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk Krypto-Charts.apk
          gh release create "$GITHUB_REF_NAME" Krypto-Charts.apk --title "Krypto Charts $GITHUB_REF_NAME" --generate-notes
  device-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android-app
          script: |
            adb shell settings put secure navigation_mode 0
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/de.kryptotagebuch.charts/files/qa ../android-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-UI-QA
          path: |
            android-qa/**
            android-app/app/build/reports/androidTests/**
